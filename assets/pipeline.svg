<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <rect width="900" height="300" rx="14" fill="#171A26"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#EDE8DD">BUILD PIPELINE</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5FB88F"/>
    </marker>
  </defs>

  <!-- arrows -->
  <path d="M 240,140 L 370,80" stroke="#5FB88F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 240,160 L 370,220" stroke="#5FB88F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 580,75 L 660,75" stroke="#E3A548" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 580,225 L 660,225" stroke="#E3A548" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- PWA box -->
  <rect x="40" y="110" width="200" height="80" rx="10" fill="#1F2A44" stroke="#5FB88F" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#EDE8DD">단일 PWA</text>
  <text x="140" y="166" text-anchor="middle" font-size="12" fill="#B9B4A8">HTML · CSS · JS</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#B9B4A8">Canvas 2D · Web Audio API</text>

  <!-- TWA box -->
  <rect x="380" y="40" width="200" height="70" rx="10" fill="#1F2A44" stroke="#3A466E" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#EDE8DD">TWA</text>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#B9B4A8">Android 패키징</text>

  <!-- Electron box -->
  <rect x="380" y="190" width="200" height="70" rx="10" fill="#1F2A44" stroke="#3A466E" stroke-width="1.5"/>
  <text x="480" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#EDE8DD">Electron</text>
  <text x="480" y="240" text-anchor="middle" font-size="11" fill="#B9B4A8">Windows/macOS 데스크톱</text>

  <!-- Google Play box -->
  <rect x="660" y="40" width="200" height="70" rx="10" fill="#1F2A44" stroke="#E3A548" stroke-width="2"/>
  <text x="760" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E3A548">Google Play</text>
  <text x="760" y="90" text-anchor="middle" font-size="11" fill="#B9B4A8">7종 게임 정식 출시</text>

  <!-- Steam box -->
  <rect x="660" y="190" width="200" height="70" rx="10" fill="#1F2A44" stroke="#E3A548" stroke-width="2"/>
  <text x="760" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#E3A548">Steam</text>
  <text x="760" y="240" text-anchor="middle" font-size="11" fill="#B9B4A8">Mini Court · Stealth Ops</text>

  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#6E6A5E">기획·개발·아트·사운드부터 스토어 등록까지 게임당 전 과정 단독 수행</text>
</svg>
