    <tspan fill="#B8862F">Soodal Games</tspan>
    <tspan> 운영 · 7개 게임 출시</tspan>
  </text>
  <text x="28" y="194" font-size="18" fill="#4A4638">
    <tspan>동시에 </tspan>
