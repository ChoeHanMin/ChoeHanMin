  <text x="28" y="276" font-size="18" fill="#4A4638">학교에서는 컴퓨터공학을, 밤에는 게임을 만듭니다.</text>
  <text x="28" y="304" font-size="18" fill="#4A4638">단일 HTML/CSS/JS PWA → TWA/Electron 빌드 파이프라인으로 Google Play·Steam 동시 출시.</text>

  <rect x="28" y="314" width="10" height="18" fill="#B8862F">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- easter egg: tiny pixel controller drifting across the bottom -->
  <g>
