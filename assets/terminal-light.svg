  <text x="28" y="90" font-size="19">
    <tspan fill="#2E8B63">~$</tspan>
    <tspan fill="#1F2A44" dx="8">whoami</tspan>
  </text>

  <text x="28" y="126" font-size="18" fill="#4A4638">
